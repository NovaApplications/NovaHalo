<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Halo - Custom Android Launcher</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="logo">
                <h1>🚀 Nova Halo</h1>
            </div>
            <ul class="nav-links">
                <li><a href="#overview">Overview</a></li>
                <li><a href="#releases">Releases</a></li>
                <li><a href="https://github.com/NovaApplications/NovaHalo" target="_blank">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <section id="overview" class="overview">
        <div class="container">
            <div class="readme-card">
                <h2>About Nova Halo</h2>
                <div id="readme-content" class="readme-body">
                    <p>Loading project information...</p>
                </div>
            </div>
        </div>
    </section>

    <section id="releases" class="releases">
        <div class="container">
            <h2>Latest Release</h2>
            <div id="releases-container" class="releases-list">
                <p class="loading">Loading release notes...</p>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Nova Halo. Licensed under Apache License 2.0</p>
            <p><a href="https://github.com/NovaApplications/NovaHalo" target="_blank">View on GitHub</a></p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
